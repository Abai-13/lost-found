server:
  port: 8080

spring:
  # 本地开发凭据放在 application-local.yml（已 gitignore，不进仓库）
  # 该文件不存在时回落到下面的默认值，克隆仓库的人改成自己的即可
  config:
    import: optional:classpath:application-local.yml

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/lost_found?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:root}

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  # Redis 缓存
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8        # 最多同时 8 个连接
          max-idle: 8          # 空闲时保留 8 个
          min-idle: 0          # 最少空闲（0 表示不保留）

  cache:
    type: redis
    redis:
      time-to-live: 300000    # 默认缓存 5 分钟（毫秒）

# MyBatis-Plus
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
  mapper-locations: classpath:mapper/*.xml

# JWT 配置
jwt:
  secret: "${JWT_SECRET:YourSecretKeyForLostFoundProject2024@#$%^&*MakeItLongEnough}"
  expire-days: 7

# 日志
logging:
  level:
    com.lostfound: debug

# DeepSeek AI 配置
deepseek:
  api-url: https://api.deepseek.com/v1/chat/completions
  api-key: ${DEEPSEEK_API_KEY:}
  model: deepseek-chat
  connect-timeout: 3
  read-timeout: 30
  max-tokens: 500
