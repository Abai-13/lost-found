server:
  port: 8080

spring:
  # 本地开发凭据放在 application-local.yml（已 gitignore，不进仓库）
  # 该文件不存在时回落到下面的默认值，克隆仓库的人改成自己的即可
  config:
    import: optional:classpath:application-local.yml

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/lost_found?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:root}
    hikari:
      # 默认值是 10。压测实测：50 并发下 10 个连接**够用** ——
      # 调到 50 后 QPS 124.5 → 124.3、平均响应 299ms → 299ms，没有任何变化。
      # 原因：124 QPS × 单请求 77ms 的 SQL ≈ 9.5 个连接，10 个正好覆盖。
      #
      # 保留 50 是为并发梯度里那个工作点：25 并发时能跑到 252 QPS，
      # 那时需要约 19 个连接，10 个才会成为真瓶颈。
      # ⚠️ 别把这条当成优化成果 —— 它当前不是瓶颈，完整数据见 bench/REPORT.md 第五节。
      maximum-pool-size: 50
      minimum-idle: 10
      connection-timeout: 3000

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  # Redis 缓存
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8        # 最多同时 8 个连接
          max-idle: 8          # 空闲时保留 8 个
          min-idle: 0          # 最少空闲（0 表示不保留）

  cache:
    type: redis
    redis:
      time-to-live: 300000    # 默认缓存 5 分钟（毫秒）

# MyBatis-Plus
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
  mapper-locations: classpath:mapper/*.xml

# JWT 配置
jwt:
  secret: "${JWT_SECRET:YourSecretKeyForLostFoundProject2024@#$%^&*MakeItLongEnough}"
  expire-days: 7

# 日志
logging:
  level:
    com.lostfound: debug

# 大模型配置 —— 都是 OpenAI 兼容接口，换供应商只改下面三项，代码不动
llm:
  # 切供应商的方式（启动后端前设环境变量）：
  #   DeepSeek（当前）  无需设置，用默认值
  #   硅基流动（免费）   LLM_API_URL=https://api.siliconflow.cn/v1/chat/completions
  #                     LLM_MODEL=Qwen/Qwen2.5-7B-Instruct
  #                     LLM_API_KEY=sk-xxx
  api-url: ${LLM_API_URL:https://api.deepseek.com/v1/chat/completions}
  # 兼容旧的环境变量名，之前只在环境里配了 DEEPSEEK_API_KEY
  api-key: ${LLM_API_KEY:${DEEPSEEK_API_KEY:}}
  # ⚠️ 这里刻意用 deepseek-chat（已弃用的别名），而不是官方 /v1/models 返回的 deepseek-flash。
  #
  #    踩过的坑：deepseek-chat 这个别名会被映射到 deepseek-v4-flash 的
  #    **非思考模式**，而直接用 deepseek-flash 会走**思考模式** ——
  #    模型先"想"再"答"，推理 token 和输出 token 共用 max-tokens 额度。
  #    实测 max-tokens=500 时，500 个额度全被推理吃掉（reasoning_tokens=500），
  #    输出为空字符串，整个匹配接口返回空结果；调到 3000 才正常，
  #    但每次多烧 187~645 个推理 token，耗时从 1.5s 涨到 3.6s。
  #
  #    教训：「已弃用」不等于「该立刻换掉」。换之前要验证，
  #    否则修掉一个警告、引入一个 bug。
  model: ${LLM_MODEL:deepseek-chat}
  connect-timeout: 3
  read-timeout: 30
  max-tokens: 500
  # 调用失败时的重试次数（不含首次）。
  # 免费档有偶发长尾延迟（少数请求挂死超过 30 秒读超时），
  # 实测降级率在 1.4%~32.2% 之间波动，重试能救回绝大部分。
  # 只重试可恢复的错误（超时/5xx/429），401/400 这类配置错误不重试。
  max-retries: ${LLM_MAX_RETRIES:2}

# 向量化配置 —— 语义召回用（P3）
#
# 独立于上面的 llm 段：可能不是同一家供应商，超时特征也完全不同
# （对话要 30 秒读超时，向量接口实测 200~300ms 就回来了）。
embedding:
  # cloud = 调云端 API；local = 本地 ONNX 模型（P5，尚未实现）
  provider: ${EMBEDDING_PROVIDER:cloud}
  api-url: ${EMBEDDING_API_URL:https://api.siliconflow.cn/v1/embeddings}
  api-key: ${EMBEDDING_API_KEY:${SILICONFLOW_API_KEY:}}
  # bge-m3：免费档、1024 维、中文效果好。改模型必须同步改下面的 dimension，
  # 否则启动后所有向量化都会因为维度校验失败而返回 null（日志里有明确报错）。
  model: ${EMBEDDING_MODEL:BAAI/bge-m3}
  # 探针实测值，不是查文档抄的：eval/probe-embedding.js
  dimension: 1024
  # 探针实测一次 64 条 258ms（约 4ms/条），比单条调用快 55 倍
  batch-size: 64
  connect-timeout: 3
  # 比大模型的 30 秒短：向量是"算一下"不是"生成一段文字"，挂到 10 秒还没响应的多半不会好了
  read-timeout: 10
  max-retries: ${EMBEDDING_MAX_RETRIES:2}

# 限流配置
rate-limit:
  ai:
    # 每个用户每分钟允许调用 AI 接口的次数。
    # 生产 5 次/分钟够用；跑评测或压测时要调高，否则批量请求会被自己的限流挡回去。
    # 调高方式：启动后端前设置环境变量 RATE_LIMIT_AI_MAX_REQUESTS=1000
    max-requests: ${RATE_LIMIT_AI_MAX_REQUESTS:5}

# AI 匹配配置
ai:
  recall:
    # 召回后送进大模型的候选条数。
    # 调小了召回不够（候选池里的物品进不来），调大了 token 上去、干扰项也变多。
    # 改这个值必须重跑评测 —— 它直接决定命中率和成本。
    top-k: ${AI_RECALL_TOP_K:50}
