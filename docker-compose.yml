# ============================================
# docker-compose.yml — 一键启动 MySQL + Spring Boot
# 用法：docker compose up -d
# ============================================

services:
  # ---- Redis 缓存 ----
  redis:
    image: redis:7-alpine
    container_name: lost-found-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - lost-found-net

  # ---- MySQL 数据库 ----
  mysql:
    image: mysql:8.0
    container_name: lost-found-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root123          # root 密码
      MYSQL_DATABASE: lost_found             # 自动创建数据库
      TZ: Asia/Shanghai                      # 时区
    ports:
      - "3306:3306"                          # 左：宿主机端口  右：容器端口
    volumes:
      - mysql-data:/var/lib/mysql            # 数据持久化（重启不丢数据）
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql  # 首次启动自动建表
    healthcheck:                             # 健康检查（确保 MySQL 就绪后再启动 app）
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot123"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - lost-found-net

  # ---- Spring Boot 应用 ----
  app:
    build:
      context: .                             # Dockerfile 在当前目录
      dockerfile: Dockerfile
    container_name: lost-found-app
    restart: always
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker         # 激活 application-docker.yml
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-} # 从宿主机环境变量传入 AI Key
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy           # 等 Redis 就绪后再启动
    networks:
      - lost-found-net

# ---- 数据卷（MySQL 数据持久化）----
volumes:
  mysql-data:
  redis-data:                                 # Redis 数据持久化（AOF/RDB 文件）

# ---- 内部网络 ----
networks:
  lost-found-net:
    driver: bridge
